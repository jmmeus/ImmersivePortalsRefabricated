name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Checkout DimLib
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/DimLib
          path: DimLib
        continue-on-error: true

      - name: Build DimLib and Publish to MavenLocal
        run: |
          if [ -d "DimLib" ] && [ -f "DimLib/gradlew" ]; then
            cd DimLib
            chmod +x ./gradlew
            ./gradlew publishToMavenLocal || true
            cd ..
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/*.jar